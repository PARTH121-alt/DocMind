<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Origin - a general AI assistant. Ask anything, chat with the live web, or upload your documents for grounded answers with citations." />
    <title>Origin - AI Assistant</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Checks the
      // current key first, then the pre-rename one.
      (function () {
        try {
          var t = localStorage.getItem('origin.theme')
            || localStorage.getItem('docmind.theme')
            || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
